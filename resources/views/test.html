<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <title>Image Modal</title>
</head>

<body>
    <div class="container">
        <h1>Image Modal Example</h1>

        <img src="https://support.softhostit.com/public/storage/messages/13-80f187de-b806-48cb-9976-060f05584455.jpg" class="img-fluid" alt="Image" data-bs-toggle="modal" data-bs-target="#imageModal1">

        <!-- Modal -->
        <div class="modal fade" id="imageModal1" tabindex="-1" aria-labelledby="imageModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-body">
                        <img src="https://support.softhostit.com/public/storage/messages/13-80f187de-b806-48cb-9976-060f05584455.jpg" class="img-fluid" alt="Image">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
