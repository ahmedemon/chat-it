<!DOCTYPE html>
<html>

<head>
    <title>Image Selection Modal with Bootstrap 5</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .modal-body {
            text-align: center;
        }

        #selectedImage {
            max-width: 100%;
            max-height: 400px;
        }
    </style>
</head>

<body>
    <h1>Image Selection Modal with Bootstrap 5</h1>

    <input type="file" id="fileInput" class="">

    <div id="myModal" class="modal">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-body">
                    <h2>Selected Image</h2>
                    <img id="selectedImage" src="#" alt="Selected Image">
                    <button id="sendButton" class="btn btn-primary">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const fileInput = document.getElementById('fileInput');
            const modal = new bootstrap.Modal(document.getElementById('myModal'));
            const selectedImageElement = document.getElementById('selectedImage');
            const sendButton = document.getElementById('sendButton');

            fileInput.addEventListener('change', function (event) {
                const file = event.target.files[0];
                const reader = new FileReader();
                reader.onload = function (e) {
                    selectedImageElement.src = e.target.result;
                };
                reader.readAsDataURL(file);
                modal.show();
            });

            sendButton.addEventListener('click', function () {
                // Perform further actions with the selected image, such as sending it to a server
                closeModal();
            });

            modal._element.addEventListener('click', function (event) {
                if (event.target === modal._element) {
                    closeModal();
                }
            });

            function closeModal() {
                modal.hide();
            }
        });
    </script>
</body>

</html>
